# This rule is not used by the project omniroute-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to gateway.omniroute.ai resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: omniroute-operator
    app.kubernetes.io/managed-by: kustomize
  name: omniroute-viewer-role
rules:
- apiGroups:
  - gateway.omniroute.ai
  resources:
  - omniroutes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - gateway.omniroute.ai
  resources:
  - omniroutes/status
  verbs:
  - get
