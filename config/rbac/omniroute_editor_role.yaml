# This rule is not used by the project omniroute-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the gateway.omniroute.ai.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: omniroute-operator
    app.kubernetes.io/managed-by: kustomize
  name: omniroute-editor-role
rules:
- apiGroups:
  - gateway.omniroute.ai
  resources:
  - omniroutes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gateway.omniroute.ai
  resources:
  - omniroutes/status
  verbs:
  - get
