---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - gateway.omniroute.ai
  resources:
  - omniroutes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gateway.omniroute.ai
  resources:
  - omniroutes/finalizers
  verbs:
  - update
- apiGroups:
  - gateway.omniroute.ai
  resources:
  - omniroutes/status
  verbs:
  - get
  - patch
  - update
