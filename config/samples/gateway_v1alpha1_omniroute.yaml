apiVersion: gateway.omniroute.ai/v1alpha1
kind: OmniRoute
metadata:
  labels:
    app.kubernetes.io/name: omniroute-operator
    app.kubernetes.io/managed-by: kustomize
  name: omniroute-sample
  namespace: ai-platform
spec:
  image:
    repository: diegosouzapw/omniroute
    tag: "3.8.51"
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: ClusterIP
    port: 20128
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi
  config:
    existingConfigMap: omniroute-config
  credentials:
    initialPassword: "SuperSecretAdmin123!"
  persistence:
    enabled: true
    size: 256Mi
    storageClass: local-path
    accessMode: ReadWriteOnce
  probes:
    livenessPath: /
    readinessPath: /
    startupPath: /
  # basePath: "/omniroute"
  # env:
  #   - name: APP_LOG_LEVEL
  #     value: "info"
  gateway:
    enabled: true
    gatewayClassName: eg
    gatewayName: eg
    hostname: omniroute.100.72.5.80.nip.io
    gatewayPort: 8080
  # redis:
  #   url: redis://redis:6379
  #   keyPrefix: "omniroute:"
  # encryption:
  #   existingSecret: omniroute-encryption-key
  #   keyVersion: "1"
