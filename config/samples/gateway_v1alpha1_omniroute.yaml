apiVersion: gateway.omniroute.ai/v1alpha1
kind: OmniRoute
metadata:
  labels:
    app.kubernetes.io/name: omniroute-operator
    app.kubernetes.io/managed-by: kustomize
  name: omniroute-sample
  namespace: ai-platform
spec:
  image:
    repository: diegosouzapw/omniroute
    tag: "3.8.51"
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    type: ClusterIP
    port: 20128
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  config:
    existingConfigMap: omniroute-config
  credentials:
    existingSecret: omniroute-secrets
  persistence:
    enabled: true
    size: 256Mi
    storageClass: local-path
    accessMode: ReadWriteOnce
  probes:
    livenessPath: /api/monitoring/health
    readinessPath: /api/monitoring/health
    startupPath: /api/monitoring/health
