name: Publish Artifact Hub Metadata

on:
  push:
    branches:
      - main
    paths:
      - "artifacthub-repo.yml"
      - "charts/omniroute-operator/Chart.yaml"
      - ".github/workflows/artifacthub.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ORAS
        uses: oras-project/setup-oras@v1
        with:
          version: "1.2.2"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Push Artifact Hub metadata
        run: |
          oras push ghcr.io/vinaycharlie01/helm-charts/omniroute-operator:artifacthub.io \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml
