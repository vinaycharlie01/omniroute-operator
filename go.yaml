setup:
  modDownload: true
  modTidy: false

build:
  output: bin/manager
  main: ./cmd/
  noCGO: true

crossBuild:
  main: ./cmd/
  binary: manager
  outputDir: dist
  platforms:
    - os: linux
      arch: amd64
    - os: linux
      arch: arm64

test:
  packages:
    - ./...
  args:
    - "-v"
    - "-short"
    - "-timeout=120s"

race:
  packages:
    - ./...
  args:
    - "-short"
    - "-timeout=120s"

coverage:
  packages:
    - ./api/...
    - ./internal/controller/
  output: coverage.out
  args:
    - "-timeout=120s"

bench:
  packages:
    - ./...
  args:
    - "-timeout=120s"

integration:
  packages:
    - ./tests/integration/
  args:
    - "-v"
    - "-timeout=10m"
    - "-tags=integration"
  env:
    - "INTEGRATION=1"

lint:
  args:
    - "--timeout=10m"

vet:
  packages:
    - ./...
