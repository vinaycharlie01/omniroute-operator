{{- if .Values.defaultSecret.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.defaultSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "omniroute-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.defaultSecret.jwtSecret | default "auto-generated-default-jwt-secret-key" | quote }}
  API_KEY_SECRET: {{ .Values.defaultSecret.apiKeySecret | default "auto-generated-default-api-key-secret-key" | quote }}
  {{- if .Values.defaultSecret.initialPassword }}
  INITIAL_PASSWORD: {{ .Values.defaultSecret.initialPassword | quote }}
  {{- end }}
{{- end -}}
